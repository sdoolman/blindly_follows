stages:
  - test
  - build
  - release

default:
  image: python:3.10-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends graphviz build-essential git libgmp-dev libmpfr-dev libmpc-dev
    - pip install --upgrade pip setuptools wheel
    - pip install "git+https://github.com/elliptic-shiho/primefac-fork.git"
    - pip install matplotlib transitions gmpy2 graphviz bitstring progressbar2 tqdm pytest ruff

lint:
  stage: test
  script:
    - ruff check .

test:
  stage: test
  script:
    - pytest -v

build_package:
  stage: build
  script:
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG - Modernized Blind State Machine Execution'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
