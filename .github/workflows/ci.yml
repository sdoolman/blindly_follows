name: CI Workflow

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz libgmp-dev libmpfr-dev libmpc-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install "git+https://github.com/elliptic-shiho/primefac-fork.git"
        pip install matplotlib transitions gmpy2 graphviz bitstring progressbar2 tqdm pytest ruff

    - name: Code Linting
      run: |
        ruff check .

    - name: Run Test Suite
      run: |
        pytest
